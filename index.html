<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sama</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Cairo',sans-serif;background:linear-gradient(160deg,#ffffff 0%,#e4f0fb 55%,#ffe8d0 100%);display:flex;align-items:center;justify-content:center}
.star{position:fixed;pointer-events:none;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.35) rotate(15deg);opacity:.5}}

.stage{display:flex;flex-direction:column;align-items:center;gap:26px;transition:opacity .8s,transform .8s}
.stage.gone{opacity:0;transform:scale(.9);pointer-events:none}
.env{position:relative;width:min(82vw,340px);height:min(56vw,232px);cursor:pointer;perspective:900px;filter:drop-shadow(0 14px 22px rgba(31,95,168,.25))}
.back{position:absolute;inset:0;background:#e8740c;border-radius:8px}
.paper{position:absolute;left:7%;right:7%;top:8%;height:82%;background:#fff;border-radius:4px;transition:transform .9s .7s}
.env.open .paper{transform:translateY(-38%)}
.pocket{position:absolute;inset:0;background:#f7a54f;border-radius:8px;clip-path:...;z-index:3}.flap{position:absolute;left:0;right:0;top:0;height:56%;transform-origin:top;transition:transform .8s,z-index 0s .4s;z-index:4;transform-style:preserve-3d}
.flap div{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ff{background:url(flower.jpeg) center top/cover}
.fb{background:#ff9a2e}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;left:50%;top:56%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:#fff;border:3px solid #1f5fa8;color:#1f5fa8;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;z-index:6;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:opacity .4s,transform .4s}
.env.open .seal{opacity:0;transform:scale(.5)}
.hint{font-size:.85rem;color:#1f5fa8;opacity:.8;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

.letter{position:fixed;display:flex;width:min(94vw,760px);height:min(80vh,540px);border-radius:16px;overflow:hidden;
  box-shadow:0 18px 50px rgba(18,58,102,.35);opacity:0;visibility:hidden;transform:scale(.9) translateY(20px);transition:opacity 1s,transform 1s,visibility 1s;background:#fff}
.letter.show{opacity:1;visibility:visible;transform:none}

<body>
<div class="stage" id="stage">
  <div class="env" id="env">
    <div class="back"></div>
    <div class="paper"></div>
    <div class="pocket"></div>
    <div class="flap"><div class="ff"></div><div class="fb">🫣</div></div>
    <div class="seal">Sama</div>
  </div>
</div>

<div class="letter" id="letter">
  <div class="txt"><div class="txt-in">
        <div class="msg"> <br>سما يعني الواحد لو قعد يقول من هنا للصبح مش هيخلص الصراحه .. حقيقي يا سما انا بعزك اوي و بقدرك اوي.. شكرا ليكِ و لوجودك و انك بتدعميني و تشجعيني و ربنا يوفقك للأفضل و الأصلح ليكِ دائما🤍</div>
  </div></div>
<div class="pic"><img src="proud.jpeg" alt=""></div></div>

<script>
const cols=['#e8740c','#1f5fa8','#ffb866','#7fb2e5'];
for(let i=0;i<22;i++){
  const s=document.createElement('span');
  s.className='star';
  s.textContent=i%3?'✦':'★';
  s.style.left=Math.random()*96+'%';
  s.style.top=Math.random()*94+'%';
  s.style.fontSize=(10+Math.random()*14)+'px';
  s.style.color=cols[i%cols.length];
  s.style.animationDelay=(-Math.random()*3)+'s';
  s.style.animationDuration=(2.5+Math.random()*3)+'s';
  document.body.appendChild(s);
}
const env=document.getElementById('env');
env.addEventListener('click',()=>{
  if(env.classList.contains('open'))return;
  env.classList.add('open');
  setTimeout(()=>{document.getElementById('stage').classList.add('gone');
    document.getElementById('letter').classList.add('show');},1900);
});
</script>
</body>
